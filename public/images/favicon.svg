<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="irs-radar-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="irs-wave-grad" x1="0" y1="0" x2="32" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="irs-radar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base rounded shield container -->
  <rect width="32" height="32" rx="7.5" fill="url(#irs-radar-bg)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />

  <!-- Outer Radar Pulse Arc -->
  <path d="M 5.5 12.5 C 8.2 8.5 11.9 6.2 16 6.2 C 20.1 6.2 23.8 8.5 26.5 12.5" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round" opacity="0.6" />

  <!-- Mid Radar Pulse Arc -->
  <path d="M 8.8 15 C 10.8 12.2 13.3 10.5 16 10.5 C 18.7 10.5 21.2 12.2 23.2 15" stroke="#38bdf8" stroke-width="1.7" stroke-linecap="round" opacity="0.85" />

  <!-- Inner Radar Pulse Arc -->
  <path d="M 12 17.5 C 13.2 15.8 14.5 14.8 16 14.8 C 17.5 14.8 18.8 15.8 20 17.5" stroke="#bae6fd" stroke-width="1.8" stroke-linecap="round" filter="url(#irs-radar-glow)" />

  <!-- Center Transceiver Beacon Node -->
  <circle cx="16" cy="20.5" r="2.6" fill="#38bdf8" />
  <circle cx="16" cy="20.5" r="1.2" fill="#ffffff" />

  <!-- Characteristic IRS Harmonic Radio Wave (sine-wave oscillation across bottom) -->
  <path d="M 4 23.5 C 6.5 23.5 8 20 10.5 20 C 13 20 13.5 25 16 25 C 18.5 25 19 20 21.5 20 C 24 20 25.5 23.5 28 23.5" stroke="url(#irs-wave-grad)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
</svg>