<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="irs-bg" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1e45" />
      <stop offset="100%" stop-color="#030a17" />
    </linearGradient>
    <filter id="irs-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#irs-bg)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="2" y="2" width="508" height="508" rx="110" stroke="rgba(255, 255, 255, 0.18)" stroke-width="4" />

  <!-- IRS Brand Typography -->
  <image href="data:image/png;base64," x="46" y="185" width="420" height="142" filter="url(#irs-shadow)" />
</svg>
