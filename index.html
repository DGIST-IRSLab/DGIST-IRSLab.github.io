<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IRS Lab — Intelligent Radio Sensing Lab @ DGIST</title>
    <meta name="description" content="Intelligent Radio Sensing (IRS) Lab at DGIST. AI-driven radio sensing, multimodal perception, and physical-world intelligence led by Prof. Jae-Ho Choi." />
    <link rel="canonical" href="https://dgist-irslab.github.io/" />

    <!-- Open Graph / Search Engine Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IRS Lab @ DGIST" />
    <meta property="og:title" content="IRS Lab — Intelligent Radio Sensing Lab @ DGIST" />
    <meta property="og:description" content="Intelligent Radio Sensing (IRS) Lab at DGIST. AI-driven radio sensing, multimodal perception, and physical-world intelligence led by Prof. Jae-Ho Choi." />
    <meta property="og:url" content="https://dgist-irslab.github.io/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IRS Lab — Intelligent Radio Sensing Lab @ DGIST" />
    <meta name="twitter:description" content="Intelligent Radio Sensing (IRS) Lab at DGIST. AI-driven radio sensing, multimodal perception, and physical-world intelligence led by Prof. Jae-Ho Choi." />

    <!-- Google Search Structured Data (WebSite & Organization) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "IRS Lab — Intelligent Radio Sensing Lab @ DGIST",
        "alternateName": ["IRS Lab", "Intelligent Radio Sensing Lab", "DGIST IRS Lab"],
        "url": "https://dgist-irslab.github.io/"
      }
    </script>
    
    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Noto+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- Inline Theme Initializer to prevent flash -->
    <script>
      (function() {
        const storedTheme = localStorage.getItem('irs_theme');
        let theme = 'light';
        if (storedTheme === 'dark' || (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          theme = 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
